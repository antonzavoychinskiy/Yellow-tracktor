; Встроенный модуль управления платформой — прошивка ESP32
; Тулчейн: PlatformIO + ESP-IDF framework.
;
; Компиляция сборок не выполняется, пока не будет физического стенда
; (ESP32 + дисплей) для прошивки и визуальной проверки — см. роадмап,
; этап 10. До этого код пишется и проверяется host-тестами (test/, env native).

[platformio]
default_envs = release

[env]
platform = espressif32
board = esp32dev          ; классический ESP32 (не S2/S3/C3) — см. GPIO34/35 input-only в требованиях, п.3.2
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Собственные компоненты (драйверы, логика) — стандартный каталог,
; который ESP-IDF ищет по умолчанию рядом с "main" (у нас — src/).
board_build.embed_txtfiles =

; -Waddress-of-packed-member из вендоренной библиотеки MAVLink (см.
; mavlink/VENDORED.md) не глушится отсюда — build_flags PlatformIO
; здесь идут раньше собственного "-Werror" ESP-IDF в командной строке
; компилятора и перебиваются им. Подавлено точечно через
; target_compile_options в CMakeLists.txt компонентов, которые
; подключают common/mavlink.h (mavlink_bridge, state_machine) —
; штатный для ESP-IDF способ переопределить флаги для конкретного
; таргета. Проверено сборкой на ESP-IDF 6.0.1.

; -------------------------------------------------------------------
; release: штатная прошивка, реальный MAVLink по TELEM2 (Pixhawk).
; -------------------------------------------------------------------
[env:release]
build_flags =
    -DMODULE_SYNTHETIC_MODE=0

; -------------------------------------------------------------------
; debug_synthetic: режим отладки без Pixhawk (NFR-15..18).
; Источник телеметрии/ответов на команды — встроенный синтетический
; генератор (components/telemetry_source). Отдельная сборка, а не
; просто флаг в общей прошивке — согласно NFR-17.
; -------------------------------------------------------------------
[env:debug_synthetic]
build_flags =
    -DMODULE_SYNTHETIC_MODE=1

; -------------------------------------------------------------------
; native: хостовые unit-тесты чистой логики (конечный автомат,
; дедбенд/rate-limit, разбор MLIST/MLOAD) без ESP-IDF и без железа.
; Наполняется на этапе 9.
; -------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -DUNIT_TEST_NATIVE=1
    -std=c11
